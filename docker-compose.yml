# Vanguard Telemetry Monitor — Phase 3 observability stack
# Cross-platform: macOS (Apple Silicon), Linux, Windows (Docker Desktop)

name: vanguard-telemetry-monitor

services:
  telemetry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: vanguard-telemetry-monitor:phase3
    container_name: telemetry-daemon
    restart: unless-stopped
    ports:
      - "${HOST_HEALTH_PORT:-8080}:8080"
      - "${HOST_METRICS_PORT:-8000}:8000"
    environment:
      TELEMETRY_INTERVAL: "${TELEMETRY_INTERVAL:-1.0}"
      HEALTH_PORT: "8080"
      METRICS_PORT: "8000"
      VEHICLE_IDS: "${VEHICLE_IDS:-VH-001,VH-002,VH-003,VH-004,VH-005}"
      ANOMALY_CPU_SPIKE_PROB: "${ANOMALY_CPU_SPIKE_PROB:-0.02}"
      ANOMALY_MEMORY_LEAK_PROB: "${ANOMALY_MEMORY_LEAK_PROB:-0.01}"
      ANOMALY_CORRUPT_JSON_PROB: "${ANOMALY_CORRUPT_JSON_PROB:-0.015}"
    networks:
      - vanguard-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - vanguard-net
    depends_on:
      telemetry-daemon:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/vanguard-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - vanguard-net
    depends_on:
      - prometheus

networks:
  vanguard-net:
    driver: bridge
    name: vanguard-net

volumes:
  prometheus-data:
    name: vanguard-prometheus-data
  grafana-data:
    name: vanguard-grafana-data
