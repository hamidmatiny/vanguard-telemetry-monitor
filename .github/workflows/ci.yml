name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=daemon \
            --cov=alert_handler \
            --cov-report=term-missing \
            --cov-fail-under=65

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t vanguard-telemetry-monitor:ci .

      - name: Verify image starts
        run: |
          docker run -d --name ci-smoke-test \
            -p 8080:8080 \
            -p 8000:8000 \
            vanguard-telemetry-monitor:ci
          sleep 5
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8000/metrics | grep -q vanguard_telemetry_emitted_total
          docker stop ci-smoke-test
