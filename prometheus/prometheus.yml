# Prometheus configuration — Vanguard Telemetry Monitor
# Scrapes daemon metrics at high-resolution 5-second intervals.

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vanguard-telemetry
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets:
          - telemetry-daemon:8000
        labels:
          service: telemetry-daemon
          environment: production-sim
